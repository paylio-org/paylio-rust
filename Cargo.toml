[package]
name = "paylio"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
description = "Rust client library for the Paylio subscription API"
license = "MIT"
repository = "https://github.com/paylio-org/paylio-rust"
keywords = ["paylio", "subscription", "api", "payments"]
categories = ["api-bindings"]
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
